<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Rescowser</title>
  <style>
    :root { color-scheme: dark; --bg:#101114; --panel:#191c23; --panel2:#20242d; --text:#f1f3f5; --muted:#9ba4b2; --accent:#55c7d7; --line:#2a303b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:8vh 22px 40px; background:radial-gradient(ellipse at 50% 0%, #1b2833 0, var(--bg) 48%); color:var(--text); font:16px/1.5 "Segoe UI",system-ui,sans-serif; }
    main { width:min(760px,100%); margin:0 auto; }
    header { margin-bottom:34px; text-align:center; }
    .mark { display:inline-grid; place-items:center; width:58px; height:58px; margin-bottom:14px; border:1px solid #35515b; border-radius:18px; background:linear-gradient(145deg,#203640,#171c24); color:var(--accent); font-size:25px; font-weight:800; letter-spacing:-2px; }
    h1 { margin:0; font-size:clamp(30px,6vw,45px); letter-spacing:-1.8px; }
    .tagline { margin:8px 0 0; color:var(--muted); }
    form { display:flex; gap:9px; padding:8px; border:1px solid var(--line); border-radius:16px; background:rgba(25,28,35,.94); box-shadow:0 18px 55px #0005; }
    input { min-width:0; flex:1; padding:12px 14px; border:0; outline:0; background:transparent; color:var(--text); font:inherit; }
    button { padding:0 19px; border:0; border-radius:11px; background:var(--accent); color:#071316; font:600 14px/1.2 "Segoe UI",system-ui,sans-serif; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    h2 { margin:34px 0 13px; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; }
    a { color:inherit; text-decoration:none; }
    .card { display:flex; min-height:82px; align-items:center; gap:12px; padding:15px; border:1px solid var(--line); border-radius:14px; background:var(--panel); transition:background .15s,border-color .15s,transform .15s; }
    .card:hover { transform:translateY(-2px); border-color:#3e7884; background:var(--panel2); }
    .icon { display:grid; flex:0 0 35px; place-items:center; width:35px; height:35px; border-radius:10px; background:#29323b; color:var(--accent); font-size:15px; font-weight:800; }
    .name { display:block; font-size:14px; font-weight:650; }
    .desc { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
    footer { margin-top:34px; color:#707a88; font-size:11px; text-align:center; }
    @media(max-width:560px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } body { padding-top:48px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">R</div>
      <h1>Rescowser</h1>
      <p class="tagline">Browse without baggage.</p>
    </header>

    <form id="search" role="search">
      <input id="query" type="search" placeholder="Pesquisar na Web ou introduzir endereço…" autocomplete="off" autofocus aria-label="Pesquisar na Web ou introduzir endereço">
      <button type="submit">Pesquisar</button>
    </form>

    <h2>Atalhos</h2>
    <section class="grid" aria-label="Atalhos">
      <a class="card" href="https://www.google.com/"><span class="icon">G</span><span><span class="name">Google</span><span class="desc">Pesquisa</span></span></a>
      <a class="card" href="https://www.youtube.com/"><span class="icon">▶</span><span><span class="name">YouTube</span><span class="desc">Vídeo</span></span></a>
      <a class="card" href="https://github.com/"><span class="icon">GH</span><span><span class="name">GitHub</span><span class="desc">Código e projetos</span></span></a>
      <a class="card" href="https://support.microsoft.com/"><span class="icon">M</span><span><span class="name">Microsoft</span><span class="desc">Suporte Windows</span></span></a>
      <a class="card" href="https://support.mozilla.org/pt-PT/"><span class="icon">F</span><span><span class="name">Mozilla</span><span class="desc">Ajuda Firefox</span></span></a>
      <a class="card" href="https://www.cloudflare.com/learning/"><span class="icon">C</span><span><span class="name">Cloudflare</span><span class="desc">Web e segurança</span></span></a>
    </section>

    <footer>Rescowser 0.1 · Portable Gecko browser · Not affiliated with Mozilla</footer>
  </main>
  <script>
    document.getElementById('search').addEventListener('submit', function (event) {
      event.preventDefault();
      const value = document.getElementById('query').value.trim();
      if (!value) return;
      const looksLikeAddress = /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}([/:?#].*)?$/i.test(value) || value.startsWith('localhost');
      const destination = looksLikeAddress
        ? (value.startsWith('http://') || value.startsWith('https://') ? value : 'https://' + value)
        : 'https://www.google.com/search?q=' + encodeURIComponent(value);
      window.location.href = destination;
    });
  </script>
</body>
</html>
